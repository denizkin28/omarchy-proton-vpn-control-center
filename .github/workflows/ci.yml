name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Validate shell scripts
        run: bash -n protonvpn-signin-terminal tools/package.sh tests/fake-protonvpn
      - name: Run JavaScript and QML source tests
        run: node --test tests/model.test.js tests/qml-ui.test.js
      - name: Run helper and lifecycle tests
        run: |
          python tests/data-helper.test.py
          python tests/system-helper.test.py
          python tests/lifecycle.test.py
      - name: Build release archive
        run: ./tools/package.sh "$RUNNER_TEMP/release"
